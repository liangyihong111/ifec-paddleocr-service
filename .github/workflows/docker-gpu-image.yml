name: Build GPU Docker image (CUDA 11.8)

on:
  pull_request:
    paths:
      - "app.py"
      - "field_extractor.py"
      - "requirements.txt"
      - "Dockerfile.gpu"
      - ".dockerignore"
      - ".github/workflows/docker-gpu-image.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app.py"
      - "field_extractor.py"
      - "requirements.txt"
      - "Dockerfile.gpu"
      - ".dockerignore"
      - ".github/workflows/docker-gpu-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the CUDA 11.8 GPU image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-gpu-cu118-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "python-multipart>=0.0.9,<1" "requests>=2.31,<3"

      - name: Run unit tests
        run: python -m unittest discover -v

  build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,suffix=-gpu-cu118
            type=ref,event=tag,suffix=-gpu-cu118
            type=raw,value=gpu-cu118-latest,enable={{is_default_branch}}

      - name: Build and optionally publish GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gpu
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=gpu-cu118
          cache-to: type=gha,mode=max,scope=gpu-cu118
